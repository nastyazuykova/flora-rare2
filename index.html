<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHYTOS — Коллекционные редкости</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page">

    <header class="header">
        <div class="header__container">
            <a href="#" class="header__logo">PHYTOS<span class="header__logo-dot">.</span></a>
            <nav class="header__nav">
                <button class="header__cart-toggle" id="cartBtn" aria-label="Открыть корзину">
                    <span class="header__cart-text">КОРЗИНА</span>
                    <span class="header__cart-badge" id="cartCount">0</span>
                </button>
            </nav>
        </div>
    </header>
    <main class="main">
        <section class="hero">
            <div class="hero__container">
                <h1 class="hero__title">Rare <br><span class="hero__title-accent">Botanicals</span></h1>
                <p class="hero__description">Цифровая витрина акклиматизированных мутаций, вариегатных гибридов и ультра-редких экземпляров флоры.</p>
            </div>
        </section>

        <section class="controls">
            <div class="controls__container">
                <form class="controls__form" id="filterForm" onsubmit="event.preventDefault();">
                    <div class="controls__search-wrapper">
                        <input class="controls__input" type="text" id="searchPlant" placeholder="Поиск по семейству / названию...">
                    </div>
                    <div class="controls__select-group">
                        <div class="controls__select-wrapper">
                            <select class="controls__select" id="filterRare">
                                <option value="all">Все уровни редкости</option>
                                <option value="grail">Holy Grail (Единичные)</option>
                                <option value="variegated">Вариегатные мутации</option>
                            </select>
                        </div>
                        <div class="controls__select-wrapper">
                            <select class="controls__select" id="filterLight">
                                <option value="all">Любая инсоляция</option>
                                <option value="bright">Яркий рассеянный</option>
                                <option value="shade">Глубокая тень</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
        </section>

        <section class="gallery">
            <div class="gallery__container">
                <div class="gallery__grid" id="catalogGrid">
                    </div>
            </div>
        </section>
    </main>
